name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Same image and digest as docker-compose.yml, so integration tests run against the
      # Qdrant version users actually get.
      qdrant:
        image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:6333/readyz && exit 0
            sleep 2
          done
          exit 1
      - run: npm run test:integration
